name = "recallforge-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Create with: wrangler kv:namespace create RATE_LIMITS
# Then paste the id below.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "PASTE_KV_NAMESPACE_ID"

[vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"
ALLOWED_ORIGIN = "*"
DAILY_CAP = "50"
MODEL = "gpt-4o-mini"

# Secrets (set with `wrangler secret put`):
#   OPENAI_API_KEY — the key billed to you
